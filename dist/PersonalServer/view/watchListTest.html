<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .page-size-selector {
            width: 100px;
        }
        .page-jump-input {
            width: 60px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Watch List</h2>
        
        <!-- 搜索框和排序选择 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="keywordInput" class="form-control" placeholder="搜索关键词">
                    <button id="searchBtn" class="btn btn-primary">搜索</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <select id="sortFieldSelect" class="form-select">
                        <option value="id">ID</option>
                        <option value="name">名称</option>
                        <option value="rate">评分</option>
                    </select>
                    <select id="sortDirectionSelect" class="form-select">
                        <option value="asc">升序</option>
                        <option value="desc">降序</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- 数据列表表格 -->
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>英文名</th>
                    <th>评分</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <!-- 数据将通过JavaScript动态加载 -->
            </tbody>
        </table>
        
        <!-- 分页控制 -->
        <div class="pagination-controls">
            <div>
                <select id="pageSizeSelect" class="form-select page-size-selector">
                    <option value="5">5条/页</option>
                    <option value="10" selected>10条/页</option>
                    <option value="20">20条/页</option>
                    <option value="50">50条/页</option>
                </select>
            </div>
            
            <div>
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" id="prevPageBtn">
                            <a class="page-link" href="#" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" id="nextPageBtn">
                            <a class="page-link" href="#" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            
            <div>
                <span>跳转到</span>
                <input type="number" id="pageJumpInput" class="form-control page-jump-input" min="1">
                <span>页</span>
                <button id="pageJumpBtn" class="btn btn-outline-secondary">跳转</button>
            </div>
            
            <div>
                <span id="pageInfo">第1页，共1页</span>
            </div>
        </div>
    </div>

    <script>
        // 全局变量存储分页状态
        let currentState = {
            draw: 1,
            page: 1,
            pageSize: 10,
            keyword: '',
            sortField: 'id',
            sortDirection: 'asc',
            totalPages: 1,
            totalItems: 0
        };

        // DOM元素
        const elements = {
            tableBody: document.getElementById('dataTableBody'),
            keywordInput: document.getElementById('keywordInput'),
            searchBtn: document.getElementById('searchBtn'),
            sortFieldSelect: document.getElementById('sortFieldSelect'),
            sortDirectionSelect: document.getElementById('sortDirectionSelect'),
            pageSizeSelect: document.getElementById('pageSizeSelect'),
            prevPageBtn: document.getElementById('prevPageBtn'),
            nextPageBtn: document.getElementById('nextPageBtn'),
            pageJumpInput: document.getElementById('pageJumpInput'),
            pageJumpBtn: document.getElementById('pageJumpBtn'),
            pageInfo: document.getElementById('pageInfo')
        };

        // 初始化事件监听
        function initEventListeners() {
            // 搜索按钮点击事件
            elements.searchBtn.addEventListener('click', () => {
                currentState.keyword = elements.keywordInput.value;
                currentState.page = 1; // 搜索后回到第一页
                currentState.draw++;
                fetchData();
            });

            // 排序字段变化事件
            elements.sortFieldSelect.addEventListener('change', () => {
                currentState.sortField = elements.sortFieldSelect.value;
                currentState.draw++;
                fetchData();
            });

            // 排序方向变化事件
            elements.sortDirectionSelect.addEventListener('change', () => {
                currentState.sortDirection = elements.sortDirectionSelect.value;
                currentState.draw++;
                fetchData();
            });

            // 每页数量变化事件
            elements.pageSizeSelect.addEventListener('change', () => {
                currentState.pageSize = parseInt(elements.pageSizeSelect.value);
                currentState.page = 1; // 改变每页数量后回到第一页
                currentState.draw++;
                fetchData();
            });

            // 上一页按钮
            elements.prevPageBtn.addEventListener('click', () => {
                if (currentState.page > 1) {
                    currentState.page--;
                    currentState.draw++;
                    fetchData();
                }
            });

            // 下一页按钮
            elements.nextPageBtn.addEventListener('click', () => {
                if (currentState.page < currentState.totalPages) {
                    currentState.page++;
                    currentState.draw++;
                    fetchData();
                }
            });

            // 跳转页面
            elements.pageJumpBtn.addEventListener('click', () => {
                const targetPage = parseInt(elements.pageJumpInput.value);
                if (targetPage >= 1 && targetPage <= currentState.totalPages) {
                    currentState.page = targetPage;
                    currentState.draw++;
                    fetchData();
                }
            });
        }

        // 获取数据
        function fetchData() {
            // 构建请求URL
            const url = new URL('/api/WatchListFullView', window.location.origin);
            url.searchParams.append('draw', currentState.draw);
            url.searchParams.append('page', currentState.page);
            url.searchParams.append('pageSize', currentState.pageSize);
            url.searchParams.append('keyword', currentState.keyword);
            url.searchParams.append('sortField', currentState.sortField);
            url.searchParams.append('sortDirection', currentState.sortDirection);

            // 显示加载状态
            elements.tableBody.innerHTML = '<tr><td colspan="5" class="text-center">加载中...</td></tr>';

            // 发送GET请求
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    // 更新分页信息
                    currentState.totalItems = data.total || 0;
                    currentState.totalPages = Math.ceil(currentState.totalItems / currentState.pageSize);
                    
                    // 渲染表格数据
                    renderTable(data.data || []);
                    
                    // 更新分页控件状态
                    updatePaginationControls();
                    
                    // 更新页面信息显示
                    updatePageInfo();
                })
                .catch(error => {
                    console.error('获取数据失败:', error);
                    elements.tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败: ' + error.message + '</td></tr>';
                });
        }

        // 渲染表格数据
        function renderTable(data) {
            if (data.length === 0) {
                elements.tableBody.innerHTML = '<tr><td colspan="5" class="text-center">没有数据</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                html += `
                    <tr>
                        <td>${item.id || ''}</td>
                        <td>${item.name || ''}</td>
                        <td>${item.eng_name || ''}</td>
                        <td>${item.rate || ''}</td>
                        <td>${item.status || ''}</td>
                    </tr>
                `;
            });
            elements.tableBody.innerHTML = html;
        }

        // 更新分页控件状态
        function updatePaginationControls() {
            // 上一页按钮
            elements.prevPageBtn.classList.toggle('disabled', currentState.page === 1);
            
            // 下一页按钮
            elements.nextPageBtn.classList.toggle('disabled', currentState.page === currentState.totalPages);
            
            // 跳转输入框
            elements.pageJumpInput.value = currentState.page;
            elements.pageJumpInput.max = currentState.totalPages;
        }

        // 更新页面信息显示
        function updatePageInfo() {
            elements.pageInfo.textContent = `第${currentState.page}页，共${currentState.totalPages}页 (总计${currentState.totalItems}条)`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
            fetchData();
        });
    </script>
</body>
</html>
