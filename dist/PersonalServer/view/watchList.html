<!DOCTYPE html>
<html>

<head>
    <!-- 支持UTF-8格式 -->
    <meta charset="UTF-8">
    <title>我的影视数据 （测试）</title>
    <!-- 链接css页面样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- 无需填写url，直接这样写就是本机的资源，浏览器自动找jcgam1ng.cn/css/watchList.css -->
    <link rel="stylesheet" href="/css/watchList.css">
</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-4">🎬 Watch List</h1>
        <table id="mediaTable" class="table table-striped">
            <thead>
                <tr>
                    <th>id</th>
                    <th>名称</th>
                    <th>英文名</th>
                    <th>标签</th>
                    <th>类型</th>
                    <th>评分</th>
                    <th>状态</th>
                    <th>开始时间</th>
                    <th>完成时间</th>
                    <th>评论</th>
                    <th>链接</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- 直接引用在线JS库，有点像引用第三方库的头文件+源文件 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <!--下面这段就是javaScript-->
    <script>
        $(document).ready(function () {
            $('#mediaTable').DataTable({
                // jquery的插件，将远程返回的json格式数据转为数据表
                "ajax": {
                    "url": "/api/WatchListFullView",//直接填这个，到时候就是请求本地的api，如果是别的才需要 域名/api/apiName
                    "dataType": "json",
                    "dataSrc": ""
                },
                "columns": [
                    { "data": "id",
                    "className": "text-nowrap"},
                    { "data": "name" },
                    { "data": "eng_name" },
                    {
                        "data": "tags",
                        "render": function (data) {
                            return data.map(tag =>
                                `<span class="badge bg-primary">${tag}</span>`
                            ).join(' ');
                        },"className": "text-nowrap"
                    },
                    { "data": "type",
                    "className": "text-nowrap" },
                    { "data": "rate",
                    "className": "text-nowrap" },
                    { "data": "status" },
                    { "data": "start_time",
                    "className": "text-nowrap" },
                    { "data": "finish_time",
                    "className": "text-nowrap" },
                    { "data": "comment" },
                    { "data": "link" }
                ]
            });
        });
    </script>
</body>

</html>
