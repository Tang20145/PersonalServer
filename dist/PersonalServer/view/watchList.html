<!DOCTYPE html>
<html>

<head>
    <!-- 支持UTF-8格式 -->
    <meta charset="UTF-8">
    <title>我的影视数据 （测试）</title>
    <!-- 链接css页面样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- 无需填写url，直接这样写就是本机的资源，浏览器自动找jcgam1ng.cn/css/watchList.css -->
    <link rel="stylesheet" href="/css/watchList.css">
</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-4">🎬 Watch List</h1>
        <table id="mediaTable" class="table table-striped">
            <thead>
                <tr>
                    <th>id</th>
                    <th>名称</th>
                    <th>英文名</th>
                    <th>标签</th>
                    <th>类型</th>
                    <th>评分</th>
                    <th>状态</th>
                    <th>开始时间</th>
                    <th>完成时间</th>
                    <th>评论</th>
                    <th>链接</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- 直接引用在线JS库，有点像引用第三方库的头文件+源文件 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <!--下面这段就是javaScript-->
    <script>
        // $(document) 选择整个文档
        // .ready() 添加一个事件处理器，当文档准备好时执行
        // function() { ... } 是要执行的函数
        $(document).ready(function () {
            // $('#example') 选择 ID 为 "example" 的 HTML 元素（通常是一个 <table>）
            // .DataTable() 在该元素上初始化 DataTables 插件
            // { ... } 是插件的配置对象
            $('#mediaTable').DataTable({
                // 2. 启用服务端模式
                serverSide: true,
                // 3. 配置AJAX请求
                ajax: {
                    url: '/api/WatchListFullView', // 服务器接口URL（需替换为你的实际地址）
                    type: 'GET',
                    data: function(d) {
                        // 4. 将DataTables的参数转换为后端需要的格式
                        return {
                        draw: d.draw,         // DataTables安全校验参数（必须回传）
                        page: Math.floor(d.start / d.length) + 1, // 计算页码（从1开始）
                        pageSize: d.length,   // 每页条数
                        keyword: d.search.value || '', // 搜索关键词
                        
                        // 可选：添加排序信息（如后端需要）
                        sortField: d.order[0]?.column,  // 排序列索引
                        sortDirection: d.order[0]?.dir  // asc/desc
                        };
                    }
                },
                "columns": [
                    { "data": "id",
                    "className": "text-nowrap"},
                    { "data": "name" },
                    { "data": "eng_name" },
                    {
                        "data": "tags",
                        "render": function (data) {
                            return data.map(tag =>
                                `<span class="badge bg-primary">${tag}</span>`
                            ).join(' ');
                        },"className": "text-nowrap"
                    },
                    { "data": "type",
                    "className": "text-nowrap" },
                    { "data": "rate",
                    "className": "text-nowrap" },
                    { "data": "status" },
                    { "data": "start_time",
                    "className": "text-nowrap" },
                    { "data": "finish_time",
                    "className": "text-nowrap" },
                    { "data": "comment" },
                    { "data": "link" }
                ]
            });
        });
    </script>
</body>

</html>
