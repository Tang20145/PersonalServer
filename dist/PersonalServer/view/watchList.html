<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.bootcdn.net/ajax/libs/normalize/8.0.1/normalize.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>Jc's WatchList</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="lh">
                  <div class="h1">
                    下面是我的观影列表数据库（测试版
                  </div>
            </div>
        </div> 
      <div class="row">
        <a href="index.html">返回</a>
      </div>
    </div>
    <div class="container">
        <div class="row">
            <button id="add-new-btn">
                + 添加新记录
            </button>
        </div>
    </div>
    <div class="container">
    <table>
        <!-- 头部 -->
        <thead>
            <!-- 一行 -->
            <tr>
                <!-- 列名 -->
                <th>id</th>
                <th>name</th>
                <th>eng_name</th>
                <th>tags</th>
                <th>type</th>
                <th>rate</th>
                <th>start_time</th>
                <th>finish_time</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="watch-list-tbody">
            <!-- 表格主体 javascropt通过这个 id 找到他-->


        </tbody>
    </table>

    <div id="watch-list-pagination-controls"></div>
</div>

    <script src="javascript/watchList.js"></script> 
</body>
</html>
