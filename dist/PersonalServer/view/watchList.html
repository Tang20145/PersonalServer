<!DOCTYPE html>
<html>
<head>
    <title>我的影视数据</title>
    <link rel="stylesheet" href="style.css">
    <!-- 直接使用在线CSS库（无需下载） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
</head>
<body>
    <div class="container mt-3">
        <h1 class="text-center mb-4">🎬 我的观影记录</h1>
        <table id="mediaTable" class="table table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>标签</th>
                    <th>操作</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- 直接引用在线JS库（按顺序复制） -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    
    <script>
    // 这段代码会让表格自动加载数据
    $(document).ready(function() {
        $('#mediaTable').DataTable({
            "ajax": {
                "url": "http://localhost:8080/api/data",
                "dataType": "json",
                "dataSrc": ""
            },
            "columns": [
                { "data": "id" },
                { "data": "name" },
                { "data": "type" },
                { 
                    "data": "tags",
                    "render": function(data) {
                        // 将标签数组转为彩色标签
                        return data.map(tag => 
                            `<span class="badge bg-primary">${tag}</span>`
                        ).join(' ');
                    }
                },
                {
                    "data": "id",
                    "render": function(data) {
                        return `<button class="btn btn-sm btn-danger" onclick="deleteItem(${data})">删除</button>`;
                    }
                }
            ]
        });
    });

    // 删除函数（需要你的后端实现DELETE接口）
    function deleteItem(id) {
        if(confirm('确定要删除吗？')) {
            fetch(`http://localhost:8080/api/data/${id}`, {
                method: 'DELETE'
            }).then(() => {
                alert('删除成功！');
                $('#mediaTable').DataTable().ajax.reload(); // 刷新表格
            });
        }
    }
    </script>
</body>
</html>
